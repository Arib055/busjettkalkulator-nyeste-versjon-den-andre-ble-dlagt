<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Budsjett</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Budsjettkalkulator</h1>

    <label>Navn:</label>
    <input id="navn" type="text">

    <br><br>

    <label>Beløp:</label>
    <input id="belop" type="number">

    <br><br>

    <label>Type:</label>
    <select id="type">
        <option value="">Velg</option>
        <option value="inntekt">Inntekt</option>
        <option value="utgift">Utgift</option>
    </select>

    <br><br>

    <button onclick="leggTil()">Legg til</button>

    <h2>Oversikt</h2>

    <p>Inntekter: <span id="inntekt">0</span> kr</p>
    <p>Utgifter: <span id="utgift">0</span> kr</p>
    <p>Saldo: <span id="saldo">0</span> kr</p>

    <h2>Poster</h2>

    <ul id="liste"></ul>

    <script src="script.js"></script>
</body>
</html>
