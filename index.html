<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budsjettkalkulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Budsjettkalkulator</h1>
    <p>Legg inn inntekter og utgifter og se hvor mye du har igjen.</p>
  </header>
 
  <main>
    <section>
      <h2>Legg til post</h2>
      <form id="budsjettForm">
        <label for="navn">Navn</label>
        <input id="navn" type="text" placeholder="Lønn" required>
 
        <label for="belop">Beløp</label>
        <input id="belop" type="number" min="0" step="0.01" placeholder="0" required>
 
                <div class="form-gruppe">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" required>
                        <option value="">Velg kategori</option>
                        <option value="lønn">Lønn</option>
                        <option value="stipend">Stipend</option>
                        <option value="bolig">Bolig</option>
                        <option value="mat">Mat</option>
                        <option value="transport">Transport</option>
                        <option value="lån">Lån</option>
                        <option value="skatt">Skatt</option>
                        <option value="annet">Annet</option>
                    </select>
                </div>
 
        <label for="type">Type</label>
        <select id="type" required>
          <option value="">Velg</option>
          <option value="inntekt">Inntekt</option>
          <option value="utgift">Utgift</option>
        </select>
 
        
        <button type="submit">Legg til</button>
      </form>
    </section>
 
    <section>
      <h2>Månedsoversikt</h2>
      <div class="summer">
        <div class="kort inntekter"><h3>Inntekter</h3><p id="totalInntekt">0 kr</p></div>
        <div class="kort utgifter"><h3>Utgifter</h3><p id="totalUtgift">0 kr</p></div>
        <div class="kort saldo"><h3>Saldo</h3><p id="saldo">0 kr</p></div>
      </div>
    </section>
 
    <section>
      <h2>Budsjettposter</h2>
      <div id="tomListe" class="tom-liste">Du har ikke lagt til noen poster ennå.</div>
      <ul id="budsjettListe"></ul>
    </section>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
